[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "WaselAgent"
version = "0.1.0"
description = "Wasel - AI pothole detection and road repair dispatch for Saudi Arabia"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "aws-opentelemetry-distro",
    "bedrock-agentcore >= 1.9.1",
    "botocore[crt] >= 1.35.0",
    "mcp ~= 1.24.0",
    "strands-agents >= 1.15.0",
    "boto3 >= 1.38.0",
    "pillow >= 10.0.0",
    "requests >= 2.32.0",
]

[tool.hatch.build.targets.wheel]
packages = ["."]